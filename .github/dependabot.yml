version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next:
        patterns: [next, eslint-config-next]
      lexical:
        patterns: [lexical, '@lexical/*']
      payload:
        patterns: [payload, '@payloadcms/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Docker must match the Node major supported by Vercel and package.json.
      - dependency-name: node
        update-types: ['version-update:semver-major']
