name: Initialize beta database

on:
  workflow_dispatch:

permissions:
  contents: read

# Schema changes must never overlap a release migration.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Require the production branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Database initialization must run from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Verify private configuration
        run: node scripts/verify-database-initialization.mjs
      - name: Require an empty application schema
        run: |
          set -euo pipefail
          object_count=$(printf '%s\n' "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public') + (SELECT count(*) FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace WHERE n.nspname = 'public' AND t.typtype = 'e');" | \
            docker run --rm --interactive --env DATABASE_URL postgres:17-alpine \
              sh -c 'psql --dbname="$DATABASE_URL" --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1')
          if [ "$object_count" != 0 ]; then
            echo 'Initialization stopped: public already contains tables or enums. Nothing was deleted. Use a new empty database or review its migration baseline.' >&2
            exit 1
          fi
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Apply initial migrations
        run: pnpm db:migrate
      - name: Verify migration status
        run: pnpm db:migrate:status
