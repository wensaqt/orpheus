name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orpheus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orpheus_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orpheus -d orpheus_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://orpheus:ci-only-password@127.0.0.1:5432/orpheus_ci
      PAYLOAD_SECRET: ci-only-test-secret-never-use-in-production
      PAYLOAD_SCHEMA_PUSH: 'false'
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: docker run --rm --volume "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - name: Initialize an empty database through migrations
        run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:int
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser regression checks
        run: pnpm test:e2e tests/e2e/login.e2e.spec.ts tests/e2e/signup.e2e.spec.ts tests/e2e/admin.e2e.spec.ts tests/e2e/binder.e2e.spec.ts tests/e2e/scoreDocument.e2e.spec.ts tests/e2e/editorHistory.e2e.spec.ts tests/e2e/toolbar.e2e.spec.ts --project chromium
      - name: Build production container
        run: docker build --tag orpheus:ci .
      - name: Scan production image packages
        run: |
          docker save orpheus:ci --output "$RUNNER_TEMP/orpheus-image.tar"
          docker run --rm --volume "$RUNNER_TEMP/orpheus-image.tar:/input/image.tar:ro" \
            aquasec/trivy:0.75.0 image --input /input/image.tar \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Prepare private invitation smoke fixtures
        run: NODE_ENV=production pnpm exec payload run scripts/create-smoke-invitations.ts
      - name: Check container readiness
        run: |
          docker run --detach --name orpheus-smoke --network host \
            --env DATABASE_URL --env PAYLOAD_SECRET --env APP_URL \
            orpheus:ci
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost:3000/api/health
      - name: Check production security through the public API
        run: node scripts/smoke-production.mjs
      - name: Container diagnostics
        if: failure()
        run: docker logs orpheus-smoke || true
      - name: Clean up container
        if: always()
        run: docker rm --force orpheus-smoke || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
