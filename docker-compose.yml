services:
  payload:
    image: node:20-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Depuis le réseau Docker, la base est joignable sur l'hôte `postgres`
    # (port interne 5432), pas sur 127.0.0.1:5434 comme depuis la machine.
    environment:
      DATABASE_URL: postgres://orpheus:orpheus@postgres:5432/orpheus

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: orpheus
      POSTGRES_PASSWORD: orpheus
      POSTGRES_DB: orpheus
    ports:
      # 5434 sur l'hôte : 5432 et 5433 servent déjà à d'autres projets
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orpheus -d orpheus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  node_modules:
